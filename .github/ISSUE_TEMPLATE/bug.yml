name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Commands, Compose output, or logs.
      placeholder: make bootstrap
    validations:
      required: true
  - type: input
    id: docker
    attributes:
      label: Docker version
      placeholder: docker version / docker compose version
