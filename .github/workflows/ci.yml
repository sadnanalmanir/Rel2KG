name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v3
      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check

  integration:
    name: Databases, graph, SPARQL, and desk
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose file
        run: docker compose config --quiet
      - name: Start PostgreSQL and MySQL
        run: docker compose up --build -d --wait postgres mysql
      - name: Unit tests
        run: docker compose run --rm --build --no-deps tools python -m unittest discover -s /app/tests -v
      - name: Bootstrap SQLite and verify all sources
        run: docker compose run --rm --build tools
      - name: Materialize R2RML mappings
        run: docker compose run --rm --build tools rel2kg materialize
      - name: Start Oxigraph
        run: docker compose up -d oxigraph
      - name: Load graph and run SPARQL competency questions
        run: |
          docker compose run --rm --build tools rel2kg load
          docker compose run --rm --build tools rel2kg query --check
      - name: Start integration desk
        run: docker compose up -d --build desk
      - name: Desk health and Ada card
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8765/api/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8765/ | grep -q "Integration desk"
          curl -sf http://127.0.0.1:8765/api/query/ada_is_one_person | grep -q '"boolean": true'
          curl -sf "http://127.0.0.1:8765/api/person?email=ada@campus.example" | grep -q '"integrated": true'
      - name: Teardown
        if: always()
        run: docker compose down -v
