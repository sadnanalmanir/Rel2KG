[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rel2kg"
version = "0.1.0"
description = "Heterogeneous relational sources (PostgreSQL, MySQL, SQLite) for a later knowledge graph."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "Rel2KG contributors" }]
keywords = ["semantic-web", "rdbms", "postgresql", "mysql", "sqlite", "docker"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
]
dependencies = [
    "psycopg2-binary==2.9.10",
    "PyMySQL==1.1.1",
    "cryptography==44.0.2",
]

[project.scripts]
rel2kg = "rel2kg.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true
