name: rel2kg

# Lab-only credentials (user/password rel2kg). Override via `.env`. See SECURITY.md.
#   make bootstrap
#   make verify
# tools is rebuilt on `docker compose run --build` so the CLI image stays current.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rel2kg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rel2kg}
      POSTGRES_DB: ${POSTGRES_DB:-campus}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging: *default-logging
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rel2kg}
      MYSQL_USER: ${MYSQL_USER:-rel2kg}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-rel2kg}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-library}
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 25s
    logging: *default-logging
    restart: unless-stopped

  oxigraph:
    image: ghcr.io/oxigraph/oxigraph:0.5.2
    ports:
      - "${OXIGRAPH_HOST_PORT:-7878}:7878"
    volumes:
      - oxigraph_data:/data
    logging: *default-logging
    restart: unless-stopped

  tools:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-rel2kg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rel2kg}
      POSTGRES_DB: ${POSTGRES_DB:-campus}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-rel2kg}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-rel2kg}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-library}
      SQLITE_PATH: /data/courses.db
      SQL_DIR: /db
      MAPPINGS_DIR: /app/mappings
      VOCAB_PATH: /app/vocab/rel2kg.ttl
      KG_OUTPUT: /data/kg.ttl
      QUERIES_DIR: /app/queries
      OXIGRAPH_URL: http://oxigraph:7878
    volumes:
      - sqlite_data:/data
      - ./db:/db:ro
      - ./mappings:/app/mappings:ro
      - ./vocab:/app/vocab:ro
      - ./queries:/app/queries:ro
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
    init: true
    logging: *default-logging
    command: ["rel2kg", "bootstrap"]
    profiles:
      - tools

volumes:
  postgres_data:
  mysql_data:
  sqlite_data:
  oxigraph_data:
